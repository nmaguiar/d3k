name: Docker Image CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths-ignore:
    - '.github/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
    - '.github/**'
  schedule:
    - cron: '28 0 * * 6'

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Login to DockerHub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - uses: actions/checkout@v6
      name: Checkout
    - uses: docker/build-push-action@v7
      name: Build and push amd64
      with:
        platforms: linux/amd64
        context: "{{defaultContext}}"
        push: true
        provenance: false
        sbom: false
        tags: nmaguiar/d3k:build-amd64
        file: Dockerfile

  build-arm64:

    runs-on: ubuntu-24.04-arm

    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Login to DockerHub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - uses: actions/checkout@v6
      name: Checkout
    - uses: docker/build-push-action@v7
      name: Build and push arm64
      with:
        platforms: linux/arm64
        context: "{{defaultContext}}"
        push: true
        provenance: false
        sbom: false
        tags: nmaguiar/d3k:build-arm64
        file: Dockerfile

  build_manifest:
    runs-on: ubuntu-latest
    needs:
    - build
    - build-arm64

    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Login to DockerHub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Create and push multi-arch manifest
      run : |
        docker buildx imagetools create -t nmaguiar/d3k:build \
          nmaguiar/d3k:build-amd64 \
          nmaguiar/d3k:build-arm64
