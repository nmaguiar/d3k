name: Docker candidate validation
on:
  workflow_dispatch:
    inputs:
      refresh_dependencies:
        description: Refresh compatible build dependencies before native builds
        type: boolean
        default: true
  push:
    branches: [main]
    paths-ignore:
    - '.github/sec-*'
  pull_request:
    branches: [main]
    paths-ignore:
    - '.github/sec-*'
  schedule:
  - cron: '28 0 * * 6'
permissions:
  contents: read
jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - run: bash tests/fast.sh
  build-inputs:
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Install dependency refresh tools
      if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_dependencies)
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends skopeo
    - name: Resolve one shared dependency lock for both architectures
      if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_dependencies)
      run: |
        python3 scripts/update-versions.py --evidence .evidence/build-inputs
        bash tests/fast.sh
    - name: Retain existing lock for push, PR or locked manual builds
      if: github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.refresh_dependencies)
      run: |
        mkdir -p .evidence/build-inputs
        cp versions.yaml Dockerfile .evidence/build-inputs/
        printf '{"status":"LOCKED","changes":{}}\n' > .evidence/build-inputs/refresh.json
    - name: Retain resolved build inputs
      uses: actions/upload-artifact@v4
      with:
        name: build-inputs-${{ github.run_id }}
        path: .evidence/build-inputs/
        retention-days: 14
  candidate:
    needs: build-inputs
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: amd64
          runner: ubuntu-latest
        - arch: arm64
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: docker/setup-buildx-action@v4
    - name: Download shared build inputs
      uses: actions/download-artifact@v4
      with:
        name: build-inputs-${{ github.run_id }}
        path: .evidence/build-inputs
    - name: Apply resolved lock and matching Dockerfile defaults
      run: cp .evidence/build-inputs/versions.yaml .evidence/build-inputs/Dockerfile .
    - name: Install archive transport
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends skopeo jq
    - name: Discover dependency refreshes without changing locked inputs
      if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      run: bash scripts/check-dependencies.sh .evidence/dependencies
    - name: Build one native candidate archive with attestations
      run: |
        mkdir -p .evidence
        docker buildx build --platform linux/${{ matrix.arch }} --no-cache \
          --provenance=mode=max --sbom=true \
          --output type=oci,dest=.evidence/candidate.tar \
          --metadata-file .evidence/build-metadata.json .
    - name: Import the exact candidate filesystem for runtime tests
      run: bash scripts/import-candidate.sh .evidence/candidate.tar d3k-ci:candidate ${{ matrix.arch }} .evidence
    - name: Workflow compatibility
      env:
        D3K_TEST_PRIVILEGED: '1'
      run: bash tests/integration.sh d3k-ci:candidate .evidence/integration
    - name: Cold and warm readiness and initialized disk usage
      env:
        D3K_TEST_PRIVILEGED: '1'
      run: bash scripts/measure.sh d3k-ci:candidate .evidence/measurements
    - name: Experimental rootless Docker-only diagnostic (resource controls unsupported)
      id: rootless-diagnostic
      if: always()
      continue-on-error: true
      env:
        D3K_TEST_PRIVILEGED: '1'
      run: bash tests/rootless-diagnostic.sh d3k-ci:candidate .evidence/rootless-diagnostic
    - name: Report rootless Docker-only diagnostic
      if: always()
      env:
        OUTCOME: ${{ steps.rootless-diagnostic.outcome }}
      run: |
        {
          echo '### Rootless Docker-only diagnostic'
          echo "Experiment outcome: $OUTCOME. Resource controls and Kubernetes are not validated."
          if [ -f .evidence/rootless-diagnostic/results.tsv ]; then
            echo '```text'
            cat .evidence/rootless-diagnostic/results.tsv
            echo '```'
          fi
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Experimental rootless feasibility and shared workflows (no promotion gate)
      id: rootless
      if: always()
      continue-on-error: true
      env:
        D3K_TEST_PRIVILEGED: '1'
        D3K_TEST_MODE: rootless
      run: bash tests/integration.sh d3k-ci:candidate .evidence/rootless-integration
    - name: Report experimental rootless outcome
      if: always()
      env:
        OUTCOME: ${{ steps.rootless.outcome }}
      run: |
        {
          echo '### Experimental rootless workflows'
          case "$OUTCOME" in
            success) echo 'Workflow suite: PASS. This does not promote rootless support.';;
            failure) echo '**FAIL — rootless feasibility/workflows did not pass.** No rootful fallback or automatic Kubernetes disablement.';;
            *) echo 'Workflow suite: NOT TESTED.';;
          esac
          if [ -f .evidence/rootless-integration/docker-only/runtime/rootless-cgroups.txt ]; then
            echo '```text'
            cat .evidence/rootless-integration/docker-only/runtime/rootless-cgroups.txt
            echo '```'
          fi
          echo 'See retained rootless-integration logs for the failing prerequisite or test.'
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Prepare one shared scanner database snapshot
      id: scan-db
      if: always()
      run: bash scripts/scan.sh prepare .evidence/scanner
    - name: Scan the retained OCI candidate
      if: always() && steps.scan-db.outcome == 'success'
      env:
        D3K_SCAN_PLATFORM: linux/${{ matrix.arch }}
      run: bash scripts/scan.sh oci-archive .evidence/candidate.tar .evidence/scanner .evidence/candidate-scan.json
    - name: Verify buildx scan coverage and fixed compiler
      if: always() && steps.scan-db.outcome == 'success'
      uses: openaf/ojob-action@v7
      with:
        oaf: scripts/check-buildx-scan.js
        args: 'input=.evidence/candidate-scan.json'
        dist: t8
    - name: Scan immutable published reference independently
      if: always() && steps.scan-db.outcome == 'success'
      env:
        D3K_SCAN_PLATFORM: linux/${{ matrix.arch }}
      run: |
        source scripts/lock.sh
        export D3K_LOCK_FILE=$PWD/versions.yaml
        bash scripts/scan.sh image "$(lock_get PUBLISHED_BUILD)" .evidence/scanner .evidence/reference-scan.json
    - name: Scan all nested inputs independently
      if: always() && steps.scan-db.outcome == 'success'
      env:
        D3K_SCAN_PLATFORM: linux/${{ matrix.arch }}
      run: |
        source scripts/lock.sh
        export D3K_LOCK_FILE=$PWD/versions.yaml
        mkdir -p .evidence/nested-scans
        result=0
        for key in K3S_IMAGE REGISTRY_IMAGE K3D_PROXY_IMAGE K3D_TOOLS_IMAGE SOCKS_IMAGE; do
          if ! bash scripts/scan.sh image "$(lock_get "$key")" .evidence/scanner ".evidence/nested-scans/$key.json"; then result=1; fi
        done
        exit "$result"
    - name: Build and scan a labelled fresh Ubuntu control
      if: always() && steps.scan-db.outcome == 'success'
      env:
        D3K_SCAN_PLATFORM: linux/${{ matrix.arch }}
      run: |
        mkdir -p .evidence
        bash scripts/build-control.sh .evidence/control-context --repair-adduser \
          --platform linux/${{ matrix.arch }} --load -t d3k-ci:ubuntu-control > .evidence/control-build.log 2>&1
        docker run --rm --network none --entrypoint cat d3k-ci:ubuntu-control /etc/os-release > .evidence/control-os-release.txt
        control_archive="$RUNNER_TEMP/d3k-control-$GITHUB_RUN_ID-${{ matrix.arch }}.tar"
        trap 'rm -f "$control_archive"' EXIT
        docker image save d3k-ci:ubuntu-control -o "$control_archive"
        bash scripts/scan.sh archive "$control_archive" .evidence/scanner .evidence/control-scan.json
        echo 'Control filesystem OS identity:'
        cat .evidence/control-os-release.txt
        echo 'Control scanner OS identity:'
        jq '.Metadata.OS' .evidence/control-scan.json
        if ! grep -Eq '^ID="?ubuntu"?$' .evidence/control-os-release.txt || \
           ! jq -e '.Metadata.OS.Family == "ubuntu"' .evidence/control-scan.json; then
          echo '::error::Fresh Ubuntu control filesystem/scanner identity mismatch; distribution comparison is not validated'
          exit 1
        fi
    - name: Compare new fixable findings against published Ubuntu
      if: always()
      uses: openaf/ojob-action@v7
      with:
        ojob: scripts/compare-security.yaml
        args: 'baseline=.evidence/reference-scan.json candidate=.evidence/candidate-scan.json output=.evidence/security-comparison.json'
        dist: t8
    - name: Compare new fixable findings against fresh Ubuntu control
      if: always()
      uses: openaf/ojob-action@v7
      with:
        ojob: scripts/compare-security.yaml
        args: 'baseline=.evidence/control-scan.json candidate=.evidence/candidate-scan.json output=.evidence/control-security-comparison.json'
        dist: t8
    - name: Retain evidence and immutable candidate; never publish
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: candidate-${{ matrix.arch }}-${{ github.run_id }}
        path: .evidence/
        include-hidden-files: true
        retention-days: 14
