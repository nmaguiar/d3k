apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-echo
spec:
  selector:
    matchLabels:
      app: node-echo
  template:
    metadata:
      labels:
        app: node-echo
    spec:
      containers:
      - name: echo
        image: D3K_TEST_WEB_IMAGE
        command: [/bin/sh, -c]
        args:
        - hostname > /usr/share/nginx/html/index.html; exec nginx -g 'daemon off;'
        readinessProbe:
          httpGet:
            path: /
            port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: node-echo
spec:
  type: LoadBalancer
  selector:
    app: node-echo
  ports:
  - port: 8080
    targetPort: 80
