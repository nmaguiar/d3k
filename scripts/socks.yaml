# Resolved equivalent of ojob.io/kube/genSocksServer plus its LoadBalancer.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: socks-server
  labels:
    app: socks-server
spec:
  selector:
    matchLabels:
      app: socks-server
  template:
    metadata:
      labels:
        app: socks-server
    spec:
      containers:
      - name: oaf
        image: docker.io/nmaguiar/socksd@sha256:a66b86200d3630b35c89a41c64f289e5e03cc631681b3a0e6fad96fac078e005
        ports:
        - containerPort: 1080
        readinessProbe:
          tcpSocket:
            port: 1080
---
apiVersion: v1
kind: Service
metadata:
  name: socks-server
spec:
  type: LoadBalancer
  selector:
    app: socks-server
  ports:
  - port: 1080
    targetPort: 1080
