jobs:
- name: Compare retained scans
  exec: |
    var result = $sh([getOpenAFPath().replace(/\/?$/, "/") + "oaf-sb", "scripts/security-report.js", "baseline=" + args.baseline, "candidate=" + args.candidate, "gate=true"]).get(0)
